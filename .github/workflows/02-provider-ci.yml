name: Provider CI (Backend Contract Tests)

# LAB: Continuous Integration — Gate 2: Provider pipeline
# Tests the real Zerodha Express backend against the contract.
# Catches backend regressions before they hit shared environments.
#
# Runs via docker-compose (not ad-hoc `docker run`) so CI uses the exact same
# bridge network, service hostnames, and working directory as local dev —
# which matters because specmatic.yaml's actuatorUrl (http://backend:3002/...)
# and governance coverage gate are only picked up when Specmatic runs with
# /usr/src/app as its working directory and "backend" resolves as a hostname.

on:
  push:
  pull_request:

jobs:
  provider-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Contract tests + schema resiliency tests + actuator-backed API coverage
      # gate against the real backend. specmatic.yaml enforces
      # minCoveragePercentage/maxMissedOperationsInSpec, so this step fails the
      # job on insufficient coverage, not just on request/response mismatches.
      - name: Run provider contract + resiliency tests (with coverage gate)
        run: |
          docker compose --profile coverage up \
            --build --abort-on-container-exit --exit-code-from specmatic-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-coverage-report
          path: build/reports/specmatic
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose --profile coverage down -v

      # Workflow test: extracts the order id from POST /create-order's response
      # and propagates it into POST /verify-payment, proving multi-step
      # request chaining works end to end — not just isolated endpoints.
      - name: Run workflow test (create-order -> verify-payment ID propagation)
        run: |
          docker compose --profile workflow up \
            --build --abort-on-container-exit --exit-code-from specmatic-workflow-test

      - name: Tear down workflow stack
        if: always()
        run: docker compose --profile workflow down -v
