name: Consumer CI (Frontend against Stub)

# LAB: Continuous Integration — Gate 3: Consumer pipeline
# Frontend tests run against a Specmatic stub instead of the real backend.
# Catches frontend-contract mismatches before they hit production.
# Key benefit: frontend team can test without a running backend.

on:
  push:
  pull_request:

jobs:
  consumer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Start a Specmatic stub: virtualizes the backend using the contract
      # Frontend tests hit this stub on port 3002 instead of the real backend
      - name: Start Specmatic stub (virtualizes the backend for frontend tests)
        run: |
          docker run -d --name specmatic-stub \
            -v ${{ github.workspace }}:/usr/src/app \
            -p 3002:9000 \
            specmatic/specmatic:2.49.1 \
            stub contracts/openapi.yaml \
            --examples=contracts/openapi_examples \
            --port=9000

      - name: Wait for stub to be ready
        run: sleep 10

      - name: Run frontend tests against stub
        run: |
          cd frontend
          npm install
          REACT_APP_API_URL=http://localhost:3002 npm test -- --watchAll=false --passWithNoTests

      - name: Cleanup stub
        if: always()
        run: docker rm -f specmatic-stub
