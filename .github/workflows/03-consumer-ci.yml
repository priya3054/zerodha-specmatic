name: Consumer CI (Frontend against Stub)

# LAB: Continuous Integration — Gate 3: Consumer pipeline
# Frontend tests run against a Specmatic stub instead of the real backend.
# Catches frontend-contract mismatches before they hit production.
# Key benefit: frontend team can test without a running backend.

on:
  push:
  pull_request:

jobs:
  consumer-tests:
    runs-on: ubuntu-latest
    env:
      PUBLISH_TO_INSIGHTS: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write specmatic license key to file
        run: |
          echo "${{ secrets.SPECMATIC_LICENSE_KEY }}" > /tmp/specmatic-license.txt

      # Start a Specmatic stub: virtualizes the backend using the contract
      # Frontend tests hit this stub on port 3002 instead of the real backend
      - name: Start Specmatic stub (virtualizes the backend for frontend tests)
        run: |
          docker run -d --name specmatic-stub \
            -v ${{ github.workspace }}:/usr/src/app \
            -v /tmp/specmatic-license.txt:/specmatic/specmatic-license.txt:ro \
            -p 3002:9000 \
            specmatic/enterprise:latest \
            stub contracts/openapi.yaml \
            --examples=contracts/openapi_examples \
            --port=9000

      - name: Wait for stub to be ready
        run: sleep 10

      - name: Run frontend tests against stub
        run: |
          cd frontend
          npm install
          REACT_APP_API_URL=http://localhost:3002 npm test -- --watchAll=false --passWithNoTests

      - name: Cleanup stub
        if: always()
        run: docker rm -f specmatic-stub

      # Publish to Specmatic Insights on main branch only
      - name: Publish report to Specmatic Insights
        if: env.PUBLISH_TO_INSIGHTS == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/src/app \
            -v /tmp/specmatic-license.txt:/specmatic/specmatic-license.txt:ro \
            specmatic/enterprise:latest \
            send-report \
            --metadata build_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            --branch-name ${{ github.ref_name }} \
            --repo-name ${{ github.event.repository.name }} \
            --repo-id ${{ github.repository_id }} \
            --repo-url ${{ github.event.repository.html_url }}
