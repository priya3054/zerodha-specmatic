name: Contract Repo CI

# LAB: Continuous Integration — Gate 1: Central contract repository validation
# Runs on every PR and push. Catches linting errors, invalid examples,
# and backward-incompatible changes BEFORE they merge to main.

on:
  push:
  pull_request:

jobs:
  contract-validation:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PUBLISH_TO_INSIGHTS: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # STEP 1: Lint the OpenAPI contract with Spectral
      - name: Lint contracts (Spectral)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/src/app \
            stoplight/spectral:6 lint \
            /usr/src/app/contracts/openapi.yaml \
            --ruleset /usr/src/app/.spectral.yaml

      # STEP 2: Validate all examples match the contract schema
      - name: Validate examples (Specmatic)
        run: |
          echo "${{ secrets.SPECMATIC_LICENSE_KEY }}" > /tmp/specmatic-license.txt
          docker run --rm \
            -v ${{ github.workspace }}:/usr/src/app \
            -v /tmp/specmatic-license.txt:/specmatic/specmatic-license.txt:ro \
            specmatic/enterprise:latest \
            examples validate \
            --contract-file=contracts/openapi.yaml \
            --examples-dir=contracts/openapi_examples

      # STEP 3: Backward compatibility check — catches breaking changes on PRs
      # Compares current contracts/openapi.yaml against the committed baseline.
      # --base-contract was removed in newer Specmatic CLI versions; the check
      # is now git-branch based, so we build a temp repo with the baseline as
      # "main" and diff against it (same approach as the local docker-compose
      # specmatic-backward-compat service).
      - name: Backward compatibility check (Specmatic)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/src/app \
            -v /tmp/specmatic-license.txt:/specmatic/specmatic-license.txt:ro \
            --entrypoint sh \
            specmatic/enterprise:latest \
            -c '
              rm -rf /tmp/compat-check
              mkdir -p /tmp/compat-check/contracts
              cd /tmp/compat-check
              git init -q
              git checkout -q -b main
              git config user.email ci@ci.local
              git config user.name CI
              sed "s/\r$//" /usr/src/app/baseline/contracts/openapi.yaml > contracts/openapi.yaml
              git add contracts/openapi.yaml
              git commit -q -m "baseline"
              git checkout -q -b current
              sed "s/\r$//" /usr/src/app/contracts/openapi.yaml > contracts/openapi.yaml
              git add contracts/openapi.yaml
              git commit -q -m "current"
              specmatic backward-compatibility-check --base-branch=main --target-path=contracts/openapi.yaml
            '

      # STEP 4: Generate central contract repo report (main branch only)
      - name: Generate central contract repo report
        if: env.PUBLISH_TO_INSIGHTS == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/src/app \
            -v /tmp/specmatic-license.txt:/specmatic/specmatic-license.txt:ro \
            specmatic/enterprise:latest \
            central-contract-repo-report

      # STEP 5: Publish to Specmatic Insights (main branch only)
      - name: Publish report to Specmatic Insights
        if: env.PUBLISH_TO_INSIGHTS == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/src/app \
            -v /tmp/specmatic-license.txt:/specmatic/specmatic-license.txt:ro \
            specmatic/enterprise:latest \
            send-report \
            --metadata build_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            --branch-name ${{ github.ref_name }} \
            --repo-name ${{ github.event.repository.name }} \
            --repo-id ${{ github.repository_id }} \
            --repo-url ${{ github.event.repository.html_url }}
