services:

  # MongoDB — required by backend
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Your real Express + MongoDB backend (port 3002)
  backend:
    build: ./backend
    ports:
      - "3002:3002"
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    command: npm start
    environment:
      - PORT=3002
      - MONGO_URL=mongodb://mongo:27017/zerodha
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-test_key}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-test_secret}
    depends_on:
      mongo:
        condition: service_healthy

  # LAB 1 — Provider contract test: hits real backend, validates against contract
  specmatic-test:
    image: znsio/specmatic
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: test --testBaseURL=http://backend:3002 contracts/openapi.yaml
    depends_on:
      - backend

  # LAB 2 — Consumer stub: fake backend from contract, no real backend needed
  specmatic-stub:
    image: znsio/specmatic
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: stub contracts/openapi.yaml --port=9000
    ports:
      - "9000:9000"

  # External Examples Validation — validates ALL example JSONs (including partial) against contract schema
  specmatic-examples:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: examples validate --contract-file=contracts/openapi.yaml --examples-dir=contracts/openapi_examples

  # LAB: Partial Examples — stub server that serves partial examples (auto-generates missing required fields)
  specmatic-partial-stub:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: stub contracts/openapi.yaml --examples=contracts/openapi_examples --port=9000
    ports:
      - "9000:9000"
    profiles:
      - partial

  # LAB: Partial Examples loop test — runs contract tests against the partial-examples stub
  specmatic-partial-test:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: test --testBaseURL=http://specmatic-partial-stub:9000 contracts/openapi.yaml
    depends_on:
      - specmatic-partial-stub
    profiles:
      - partial

  # LAB 4 — API Coverage: tests + coverage report
  specmatic-coverage:
    image: znsio/specmatic
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: test --testBaseURL=http://backend:3002 contracts/openapi.yaml
    depends_on:
      - backend

  # LAB: Response Templating — stub that echoes request values and does data lookups
  specmatic-rt-stub:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: stub contracts/openapi.yaml --examples=contracts/response_templates/mock --port=9000
    ports:
      - "9000:9000"
    profiles:
      - response-template

  # LAB: Response Templating — contract tests against the template stub
  specmatic-rt-test:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: test --testBaseURL=http://specmatic-rt-stub:9000 contracts/openapi.yaml --examples=contracts/response_templates/test
    depends_on:
      - specmatic-rt-stub
    profiles:
      - response-template

  # LAB: Dictionary — stub using domain-aware values from openapi_dictionary.yaml (auto-detected)
  specmatic-dictionary-stub:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: stub contracts/openapi.yaml --examples=contracts/openapi_examples --port=9000
    ports:
      - "9000:9000"
    profiles:
      - dictionary

  # LAB: Dictionary — contract tests against the dictionary stub
  specmatic-dictionary-test:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: test --testBaseURL=http://specmatic-dictionary-stub:9000 contracts/openapi.yaml
    depends_on:
      - specmatic-dictionary-stub
    profiles:
      - dictionary

  # LAB: Filters — stub for filter experiments (shared across all filter profiles)
  specmatic-filter-stub:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: stub contracts/openapi.yaml --examples=contracts/openapi_examples --port=9000
    ports:
      - "9000:9000"
    profiles:
      - filters
      - filters-post
      - filters-auth

  # LAB: Filters — run ONLY STATUS=200 tests (happy-path focus)
  specmatic-filter-status:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: ["test", "--testBaseURL=http://specmatic-filter-stub:9000", "contracts/openapi.yaml", "--filter", "STATUS='200'"]
    depends_on:
      - specmatic-filter-stub
    profiles:
      - filters

  # LAB: Filters — run ONLY POST method tests
  specmatic-filter-post:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: ["test", "--testBaseURL=http://specmatic-filter-stub:9000", "contracts/openapi.yaml", "--filter", "METHOD='POST'"]
    depends_on:
      - specmatic-filter-stub
    profiles:
      - filters-post

  # LAB: Filters — run ONLY auth endpoint tests
  specmatic-filter-auth:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: ["test", "--testBaseURL=http://specmatic-filter-stub:9000", "contracts/openapi.yaml", "--filter", "PATH='/auth/signup' || PATH='/auth/login'"]
    depends_on:
      - specmatic-filter-stub
    profiles:
      - filters-auth

  # LAB: Data Adapters — mock WITH adapters (reads hooks from specmatic.yaml, starts on port 8080)
  specmatic-adapter-mock:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: ["mock"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    profiles:
      - adapters
      - no-adapters

  # LAB: Data Adapters — verify adapter works: PascalCase request succeeds with adapter
  specmatic-adapter-verify:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    entrypoint: ["curl"]
    command: ["-s", "-w", "\nHTTP Status: %{http_code}\n", "-X", "POST",
              "http://specmatic-adapter-mock:8080/newOrder",
              "-H", "Content-Type: application/json",
              "-d", "{\"Name\":\"INFY\",\"Qty\":5,\"Price\":1555.45,\"Mode\":\"BUY\"}"]
    depends_on:
      specmatic-adapter-mock:
        condition: service_healthy
    profiles:
      - adapters

  # LAB: Data Adapters — stub WITHOUT adapters (working_dir=/tmp so specmatic.yaml not found)
  specmatic-no-adapter-stub:
    image: specmatic/enterprise:latest
    working_dir: /tmp
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: stub /usr/src/app/contracts/openapi.yaml --port=8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    profiles:
      - no-adapters

  # LAB: Data Adapters — verify without adapter: same PascalCase request fails
  specmatic-no-adapter-verify:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    entrypoint: ["curl"]
    command: ["-s", "-w", "\nHTTP Status: %{http_code}\n", "-X", "POST",
              "http://specmatic-no-adapter-stub:8081/newOrder",
              "-H", "Content-Type: application/json",
              "-d", "{\"Name\":\"INFY\",\"Qty\":5,\"Price\":1555.45,\"Mode\":\"BUY\"}"]
    depends_on:
      specmatic-no-adapter-stub:
        condition: service_healthy
    profiles:
      - no-adapters

  # LAB: Filters + Studio — run the full suite (auto-starts mock + runs tests) via specmatic.yaml v3
  specmatic-suite:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: run-suite
    profiles:
      - suite

  # ALL LABS — Specmatic Studio: visual UI at http://localhost:9000/_specmatic/studio
  studio:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: studio
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles:
      - studio

volumes:
  mongo-data:
