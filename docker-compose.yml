services:

  # MongoDB — required by backend
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Your real Express + MongoDB backend (port 3002)
  backend:
    build: ./backend
    ports:
      - "3002:3002"
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    command: npm start
    environment:
      - PORT=3002
      - MONGO_URL=mongodb://mongo:27017/zerodha
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-test_key}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-test_secret}
    depends_on:
      mongo:
        condition: service_healthy

  # LAB 1 — Provider contract test: hits real backend, validates against contract
  specmatic-test:
    image: znsio/specmatic
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: test --testBaseURL=http://backend:3002 contracts/openapi.yaml
    depends_on:
      - backend

  # LAB 2 — Consumer stub: fake backend from contract, no real backend needed
  specmatic-stub:
    image: znsio/specmatic
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: stub contracts/openapi.yaml --port=9000
    ports:
      - "9000:9000"

  # External Examples Validation — validates ALL example JSONs (including partial) against contract schema
  specmatic-examples:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: examples validate --contract-file=contracts/openapi.yaml --examples-dir=contracts/openapi_examples

  # LAB: Partial Examples — stub server that serves partial examples (auto-generates missing required fields)
  specmatic-partial-stub:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: stub contracts/openapi.yaml --examples=contracts/openapi_examples --port=9000
    ports:
      - "9000:9000"
    profiles:
      - partial

  # LAB: Partial Examples loop test — runs contract tests against the partial-examples stub
  specmatic-partial-test:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: test --testBaseURL=http://specmatic-partial-stub:9000 contracts/openapi.yaml
    depends_on:
      - specmatic-partial-stub
    profiles:
      - partial

  # LAB 4 — API Coverage: tests + coverage report
  specmatic-coverage:
    image: znsio/specmatic
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: test --testBaseURL=http://backend:3002 contracts/openapi.yaml
    depends_on:
      - backend

  # LAB: Response Templating — stub that echoes request values and does data lookups
  specmatic-rt-stub:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: stub contracts/openapi.yaml --examples=contracts/response_templates/mock --port=9000
    ports:
      - "9000:9000"
    profiles:
      - response-template

  # LAB: Response Templating — contract tests against the template stub
  specmatic-rt-test:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: test --testBaseURL=http://specmatic-rt-stub:9000 contracts/openapi.yaml --examples=contracts/response_templates/test
    depends_on:
      - specmatic-rt-stub
    profiles:
      - response-template

  # LAB: Dictionary — stub using domain-aware values from openapi_dictionary.yaml (auto-detected)
  specmatic-dictionary-stub:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: stub contracts/openapi.yaml --examples=contracts/openapi_examples --port=9000
    ports:
      - "9000:9000"
    profiles:
      - dictionary

  # LAB: Dictionary — contract tests against the dictionary stub
  specmatic-dictionary-test:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: test --testBaseURL=http://specmatic-dictionary-stub:9000 contracts/openapi.yaml
    depends_on:
      - specmatic-dictionary-stub
    profiles:
      - dictionary

  # ALL LABS — Specmatic Studio: visual UI at http://localhost:9000/_specmatic/studio
  studio:
    image: specmatic/enterprise:latest
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ../license.txt:/specmatic/specmatic-license.txt:ro
    command: studio
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles:
      - studio

volumes:
  mongo-data:
