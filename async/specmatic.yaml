version: 3

# Async contract test config — Specmatic publishes to stock-orders,
# validates the order-confirmed reply against contracts/asyncapi.yaml.
# Run via: docker compose --profile async up async-contract-test --build --abort-on-container-exit

systemUnderTest:
  service:
    definitions:
      - definition:
          source:
            filesystem:
              directory: ../contracts
          specs:
            - asyncapi.yaml
    runOptions:
      asyncapi:
        type: test
        servers:
          - host: kafka:9092
            protocol: kafka
