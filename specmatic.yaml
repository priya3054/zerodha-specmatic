version: 2

contracts:
  - filesystem:
      directory: contracts
    provides:
      - zerodha-backend

# LAB: Filters — use --filter flag on the test command to scope test runs:
#   --filter "STATUS='200'"                              → only happy-path tests
#   --filter "METHOD='POST'"                             → only POST endpoint tests
#   --filter "PATH='/auth/signup' || PATH='/auth/login'" → only auth tests
# See docker-compose.yml services: specmatic-filter-status/post/auth

report:
  formatters:
    - type: text
    - type: html
  types:
    APICoverage:
      OpenAPI:
        successCriteria:
          minThresholdPercentage: 60
          maxMissedEndpointsInSpec: 3
          enforce: true
