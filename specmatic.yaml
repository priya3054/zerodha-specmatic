version: 3

# systemUnderTest: the real backend being tested
# baseUrl points to the Specmatic mock (port 8080) so run-suite is self-contained
systemUnderTest:
  service:
    definitions:
      - definition:
          source:
            filesystem:
              directory: contracts
          specs:
            - spec:
                id: zerodhaApiSpec
                path: openapi.yaml
    runOptions:
      openapi:
        type: test
        baseUrl: "http://localhost:8080"
        # actuator: reports routes actually registered on the real backend
        # (see backend/index.js GET /actuator/mappings) so Specmatic can flag
        # "Missing In Spec" / "Not Implemented" during API coverage analysis.
        actuatorUrl: http://backend:3002/actuator/mappings
        # LAB: Workflow — extract ID from create-order response, propagate to verify-payment.
        # Specmatic v1.14.2 supports extract from BODY and use via PATH params only.
        # Our Zerodha API uses body fields (not path params), so we demonstrate extract only.
        # In the lab (tasks API), extracted task_id is injected via PATH.task_id into GET/PUT/DELETE.
        workflow:
          ids:
            "POST /create-order -> 200":
              extract: "BODY.id"
        specs:
          - spec:
              id: zerodhaApiSpec
              securitySchemes:
                testAuth:
                  type: apiKey
                  token: spectest2
    data:
      examples:
        - directories:
            - ./contracts/openapi_examples

# dependencies: the mock stub that run-suite starts automatically
dependencies:
  services:
    - service:
        definitions:
          - definition:
              source:
                filesystem:
                  directory: contracts
              specs:
                - openapi.yaml
        runOptions:
          openapi:
            type: mock
            host: 0.0.0.0
            port: 8080
        data:
          examples:
            - directories:
                - ./contracts/openapi_examples
          dictionary:
            path: contracts/openapi_dictionary.yaml
  # LAB: Data Adapters — hook scripts that bridge client/spec format mismatches
  # pre:  client sends PascalCase (Name, Qty, Price) → converts to camelCase before mock validates
  # post: mock returns camelCase (message) → converts to PascalCase (Message) for client
  data:
    adapters:
      pre_specmatic_request_processor: ./hooks/pre_specmatic_request_processor.sh
      post_specmatic_response_processor: ./hooks/post_specmatic_response_processor.sh

specmatic:
  settings:
    test:
      # strictMode: true
      schemaResiliencyTests: all
  # Coverage gate: fail the run if any contract operation goes untested, or if
  # the backend implements routes the contract doesn't document (requires the
  # actuatorUrl above to be reachable).
  governance:
    report:
      formats:
        - html
      outputDirectory: build/reports/specmatic
    successCriteria:
      enforce: true
      maxMissedOperationsInSpec: 0
      minCoveragePercentage: 100

