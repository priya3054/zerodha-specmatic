version: 3

# systemUnderTest: the real backend being tested
# baseUrl points to the Specmatic mock (port 8080) so run-suite is self-contained
systemUnderTest:
  service:
    definitions:
      - definition:
          source:
            filesystem:
              directory: contracts
          specs:
            - openapi.yaml
    runOptions:
      openapi:
        type: test
        baseUrl: "http://localhost:8080"
    data:
      examples:
        - directories:
            - ./contracts/openapi_examples

# dependencies: the mock stub that run-suite starts automatically
dependencies:
  services:
    - service:
        definitions:
          - definition:
              source:
                filesystem:
                  directory: contracts
              specs:
                - openapi.yaml
        runOptions:
          openapi:
            type: mock
            host: 0.0.0.0
            port: 8080
        data:
          examples:
            - directories:
                - ./contracts/openapi_examples
          dictionary:
            path: contracts/openapi_dictionary.yaml

specmatic:
  settings:
    test:
      strictMode: true
      schemaResiliencyTests: none
